<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>meta-sight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Atkinson+Hyperlegible+Next:wght@400;500;600&family=Averia+Serif+Libre:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">meta-sight<span class="brand-sub">a memory for your home</span></div>
        <nav class="tabs" id="tabs" aria-label="View">
          <button data-tab="live" class="on">Live</button>
          <button data-tab="map">Map</button>
        </nav>
        <div class="chips" id="chips"></div>
      </header>

      <main class="grid" data-tab="live">
        <section class="panel live" id="live">
          <div class="stage" id="stage">
            <video id="video" playsinline muted></video>
            <canvas id="overlay"></canvas>
            <div class="start" id="start">
              <h1>See the next two metres. Remember the whole house.</h1>
              <p>Point the camera ahead and walk. Ask where your things are.</p>
              <div class="row">
                <button class="primary" id="btn-camera">Use the camera</button>
                <label class="ghost file">Use a video<input id="file" type="file" accept="video/*" hidden /></label>
              </div>
            </div>
            <div class="hud" id="hud" hidden>
              <canvas id="ring" width="168" height="168"></canvas>
              <div class="readout mono" id="readout"></div>
            </div>
          </div>
          <div class="belt" id="belt" aria-label="Distance per direction"></div>
          <div class="tools">
            <button class="ghost" id="btn-audio" aria-pressed="false">Audio cues: off</button>
            <details class="demo">
              <summary>Demo tools</summary>
              <button class="ghost" id="btn-test-fall">Test the fall check-in</button>
            </details>
          </div>
        </section>

        <section class="panel mapview" id="mapview">
          <canvas id="map3d"></canvas>
          <div class="map-tools">
            <button class="ghost" id="btn-fit">Fit map</button>
            <span class="mono muted" id="map-count">0 points</span>
          </div>
          <ul class="pinlist" id="pinlist" aria-label="Things I have seen"></ul>
        </section>
      </main>

      <footer class="ask">
        <form id="ask-form" autocomplete="off">
          <button type="button" class="mic" id="btn-mic" aria-label="Ask with your voice">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
          </button>
          <input id="ask-input" type="text" placeholder="Where are my keys?" enterkeyhint="send" />
          <button class="primary" type="submit">Ask</button>
        </form>
        <div class="answer" id="answer" hidden>
          <img id="answer-thumb" alt="" />
          <div>
            <p id="answer-text"></p>
            <p class="muted small mono" id="answer-meta"></p>
          </div>
        </div>
      </footer>
    </div>

    <div class="alert" id="alert" role="alertdialog" aria-live="assertive" hidden>
      <div class="alert-card">
        <h2 id="alert-title"></h2>
        <p id="alert-text"></p>
        <p class="mono muted small" id="alert-count"></p>
        <div class="row">
          <button class="primary" id="alert-ok">I'm okay</button>
          <button class="ghost" id="alert-dismiss">Dismiss</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

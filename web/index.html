<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f7fd" />
    <title>Navi</title>
    <script>
      if (new URLSearchParams(location.search).get("view") === "judge") location.replace("/judge.html" + location.hash);
      if (new URLSearchParams(location.search).has("capture")) location.replace("/capture.html" + location.search);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="lg-refract" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
        <feImage href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%20preserveAspectRatio%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22x%22%20x1%3D%220%22%20x2%3D%221%22%20y1%3D%220%22%20y2%3D%220%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22rgb%28255%2C0%2C0%29%22%2F%3E%3Cstop%20offset%3D%22.2%22%20stop-color%3D%22rgb%28128%2C0%2C0%29%22%2F%3E%3Cstop%20offset%3D%22.8%22%20stop-color%3D%22rgb%28128%2C0%2C0%29%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22rgb%280%2C0%2C0%29%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22y%22%20x1%3D%220%22%20x2%3D%220%22%20y1%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22rgb%280%2C255%2C0%29%22%2F%3E%3Cstop%20offset%3D%22.2%22%20stop-color%3D%22rgb%280%2C128%2C0%29%22%2F%3E%3Cstop%20offset%3D%22.8%22%20stop-color%3D%22rgb%280%2C128%2C0%29%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22rgb%280%2C0%2C0%29%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23000%22%2F%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22url%28%23x%29%22%2F%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22url%28%23y%29%22%20style%3D%22mix-blend-mode%3Ascreen%22%2F%3E%3C%2Fsvg%3E" preserveAspectRatio="none" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="46" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div class="world"><canvas id="map3d"></canvas></div>
    <div class="app">
      <header class="topbar glass r">
        <div class="brand">Navi<span class="brand-sub" id="brand-sub">a memory for your home</span></div>
        <div class="seg" id="modes" role="group" aria-label="Map mode">
          <button data-mode="home" aria-pressed="true">Home</button>
          <button data-mode="outside" aria-pressed="false">Outside</button>
        </div>
        <nav class="seg tabs" id="tabs" aria-label="View">
          <button data-tab="live" class="on">Live</button>
          <button data-tab="map">Map</button>
        </nav>
        <div class="chips" id="chips"></div>
        <button class="details-btn" id="btn-details" aria-pressed="false">Details</button>
      </header>

      <main class="grid" data-tab="live">
        <section class="panel live" id="live">
          <div class="stage glass" id="stage">
            <video id="video" playsinline muted></video>
            <canvas id="overlay"></canvas>
            <div class="start" id="start">
              <h1>See the next two metres. Remember the whole house.</h1>
              <p>Point the camera ahead and walk. Ask where your things are.</p>
              <div class="row">
                <button class="primary" id="btn-camera">Use the camera</button>
                <label class="ghost glass r file">Use a video<input id="file" type="file" accept="video/*" hidden /></label>
              </div>
            </div>
            <div class="hud" id="hud" hidden>
              <div id="belt3d" class="belt3d" aria-label="The haptic belt in 3D, seen from behind the wearer"></div>
              <div class="readout mono glass" id="readout"></div>
            </div>
          </div>
          <div class="belt" id="belt" aria-label="Belt motors, numbered from the front clockwise"></div>
          <div class="tools">
            <button class="ghost glass r" id="btn-fpv">View: map</button>
            <button class="ghost glass r" id="btn-audio" aria-pressed="false">Audio cues: off</button>
            <button class="ghost glass r" id="btn-motors">Belt: 8 motors</button>
            <details class="demo">
              <summary class="glass r">Demo tools</summary>
              <button class="ghost glass r" id="btn-test-fall">Test the fall check-in</button>
              <button class="ghost glass r" id="btn-belt-tour">Show the belt at 4, 8 and 16 motors</button>
            </details>
          </div>
        </section>

        <section class="panel mapview" id="mapview">
          <div class="map-tools">
            <button class="ghost glass r" id="btn-fit">Fit map</button>
            <span class="mono pill glass" id="map-count">0 points</span>
          </div>
          <ul class="pinlist" id="pinlist" aria-label="Things I have seen"></ul>
        </section>
      </main>

      <footer class="ask">
        <div id="navi-host" class="navi-host"></div>
        <div class="answer glass" id="answer" hidden>
          <img id="answer-thumb" alt="" />
          <div>
            <p id="answer-text"></p>
            <p class="muted small mono" id="answer-meta"></p>
          </div>
        </div>
        <form id="ask-form" class="glass r" autocomplete="off">
          <button type="button" class="mic" id="btn-mic" aria-label="Ask with your voice">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
          </button>
          <input id="ask-input" type="text" placeholder="Where are my keys?" enterkeyhint="send" />
          <button class="primary" type="submit">Ask</button>
        </form>
      </footer>
    </div>

    <div class="alert" id="alert" role="alertdialog" aria-live="assertive" hidden>
      <div class="alert-card glass strong">
        <h2 id="alert-title"></h2>
        <p id="alert-text"></p>
        <p class="mono muted small" id="alert-count"></p>
        <div class="row">
          <button class="primary" id="alert-ok">I'm okay</button>
          <button class="ghost glass" id="alert-dismiss">Dismiss</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

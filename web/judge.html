<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>meta-sight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="judge">
    <div class="j-frame" id="frame">
      <canvas id="cam"></canvas>
      <canvas id="cam-overlay"></canvas>
    </div>
    <header class="j-top">
      <div class="j-brand glass">meta-sight</div>
      <ol class="j-steps glass" id="steps">
        <li data-step="walk">Walk</li>
        <li data-step="obstacle">Obstacle</li>
        <li data-step="ask">Ask</li>
        <li data-step="find">Find</li>
        <li data-step="guide">Guide</li>
      </ol>
      <div class="j-source glass" id="source">Waiting for the glasses</div>
    </header>
    <ul class="j-models" id="models">
      <li class="glass" data-model="map"><i></i>MapAnything · DINOv2<b></b></li>
      <li class="glass" data-model="sam"><i></i>SAM 3.1<b></b></li>
      <li class="glass" data-model="muse"><i></i>Muse Spark<b></b></li>
      <li class="glass" data-model="dat"><i></i>DAT<b></b></li>
    </ul>
    <section class="j-caption glass" id="caption">
      <div class="j-q" id="question"></div>
      <div class="j-a" id="answer">
        <img id="answer-thumb" alt="" />
        <div>
          <b id="answer-label"></b>
          <span id="answer-seen"></span>
          <small id="answer-by"></small>
        </div>
      </div>
      <div class="j-braille" id="braille">
        <div class="j-cell" id="cell"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="j-words" id="braille-words"></div>
      </div>
    </section>
    <section class="j-belt glass">
      <h2>Haptic belt · 8 buzzers</h2>
      <canvas id="belt"></canvas>
    </section>
    <script type="module" src="/src/judge.ts"></script>
  </body>
</html>

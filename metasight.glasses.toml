# Ray-Ban Meta profile: METASIGHT_CONFIG=metasight.glasses.toml, fed by the glasses app or by
# `python -m metasight.glasses_emu`. Same providers as the room profile.
#
# hfov_deg is the emulator's 9:16 crop of the room walk (105 deg landscape, 405 of 1280 columns):
# 44.8 deg. Real glasses: Meta lists a 100 deg field of view; if that is diagonal over the 9:16
# stream it is about 61 deg horizontal. Measure on the first real footage and set it here.
# eye_height_m: see the note on the key below.
[providers]
language = "meta"
finder = "hybrid"
offline = "glimmer"  # Muse Glimmer answers when the API is unreachable
# Spoken questions: the browser's own speech recognition (the HUD's mic button). Muse Voice
# Transcribe ("meta") is refused on billing (log, 2026-11-02), so the server side is off.
asr = "off"

[safety]
segment = false
depth_scale = 0.9  # lens prior: gates which plane can be the floor; the floor measures the rest
# Glasses sit near eye level. 1.45 m fits the 11-02 bedroom take: a door handle (about 0.91 m)
# measured 0.77 m at 1.22 and 1.02 m at 1.6.
eye_height_m = 1.45
hfov_deg = 44.8  # see the note at the top
map_intrinsics = true  # MapAnything gets the lens: TUM mean error 18.7 -> 12.5 cm
detector_imgsz = 384
belt = "ble"  # the four-motor belt over Bluetooth, found by its name "metasight-belt"
belt_addr = ""
# Every cue at full strength, distance told by rhythm (slow, fast, solid): the motors are faint
# and graded cues ran at median duty 42 (slow), 114 (fast), 157 (solid), guide 73 of 255.
belt_strength = "strong"
cue_median = true  # 3-frame median on depth strips and path: rhythm flips 93-99 -> 75-89 a minute
cue_hold_s = 0.25  # a rhythm steps down only after 0.25 s: fast/solid flicker 74 -> 23 runs a minute
map_sides = false  # the map's side/back sectors buzzed the rear motors half the 11-02 take
# Bedroom ranges: silent past 1.3 m, fast inside 1.0, solid inside 0.5 (street defaults 1.5/1.6/0.7)
cue_off_m = 1.3
cue_fast_m = 1.0
cue_solid_m = 0.5
found_m = 0.9
sound = true  # spatial sound on the phone: the find beacon and the hazard beeps (false: silent)

[memory]
watchlist = [
  "bed", "dresser", "mirror", "door", "nightstand", "lamp", "mini fridge", "vacuum cleaner",
  "backpack", "desk", "computer monitor", "laptop", "chair", "armchair", "potted plant",
  "window", "picture frame", "curtain", "shelf", "pillow", "rug", "tv",
  "person", "table", "cabinet", "sofa", "stool", "box", "bag", "handbag", "suitcase", "basket",
  "trash can", "water bottle", "cup", "book", "shoe", "clothes", "fan", "speaker", "keyboard", "toy",
  "wall", "railing", "stairs", "pole", "bench", "car", "bicycle", "sign",
  "keys", "wallet", "phone", "remote control",
]
# Sent to SAM 3.1 (billed $2.50 per 1,000 images, one image per item): 6 items every 2 s is
# about $27 an hour of walking.
meta_items = ["water bottle", "keys", "wallet", "phone", "glasses case", "remote control"]
meta_interval_s = 2.0

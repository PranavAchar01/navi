# One-line provider switches. Environment variables METASIGHT_LANGUAGE / METASIGHT_FINDER win.
[providers]
# language: "openai" (stand-in until the Meta key exists) | "meta" (Muse Spark) | "template" (no model)
language = "meta"
# finder: "yoloe" (local open-vocabulary) | "sam31" (SAM 3.1 on the Meta Model API)
finder = "sam31"
# asr: "meta" (Muse Voice Transcribe on the server, streamed from the mic) | "off" (the client's own speech recognition)
asr = "meta"
# offline: "glimmer" (Muse Glimmer on this Mac answers when the API is unreachable) | "" (none)
offline = "glimmer"
# review: "wonder" (Muse Wonder reads the map's changes every review_every_min) | "glimmer" | "off"
review = "wonder"

[models]
openai_model = "gpt-4.1-mini"
meta_model = "muse-spark-1.3"      # Standard mode: footage is not used for training
sam_model = "sam-3.1"

[safety]
depth_width = 518
depth_height = 294
detector_imgsz = 320

[memory]
keyframe_hz = 1.5
window = 8
overlap = 2
voxel_m = 0.05
watchlist = ["keys", "wallet", "phone", "glasses case", "remote control", "backpack", "water bottle"]

[mode]
# home: the full persistent map of the house. outside: a short-horizon map that drops what is
# behind you, with smaller, faster windows so the safety loop stays first.
start = "home"

[mode.outside]
keyframe_hz = 2.5
window = 4
overlap = 1
voxel_m = 0.08
horizon_m = 25.0

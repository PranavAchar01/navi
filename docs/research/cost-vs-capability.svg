  <text class="lb" x="459" y="171">Envision Glasses Pro</text>
  <circle class="a" cx="645" cy="113" r="6"><title>Caregiver 20 h/week at $35/h: about $36,400 a year, 5 of 6 (only while present)</title></circle>
  <text class="lb" x="645" y="100" text-anchor="middle">Caregiver, 20 h/week</text>
  <circle class="o" cx="266" cy="113" r="7"><title>meta-sight on a computer you own: about $400, 5 of 6</title></circle>
  <text class="lb" x="266" y="100" text-anchor="middle">meta-sight (your computer)</text>
  <circle class="o" cx="365" cy="113" r="7"><title>meta-sight + new Mac mini hub: about $1,299, 5 of 6</title></circle>
  <text class="lb" x="365" y="133" text-anchor="middle">meta-sight + new Mac mini</text>
</g>
<g>
  <circle class="o" cx="100" cy="446" r="6"/><text class="lb" x="112" y="450">meta-sight</text>
  <circle class="a" cx="210" cy="446" r="6"/><text class="lb" x="222" y="450">Alternatives</text>
  <text class="su" x="740" y="450" text-anchor="end">Prices read 2026-10-29; sources in map-value-and-cost.md</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="1100" height="690"><style>:root{--ink:#161616;--paper:#f6f6f4;--card:#fff;--mute:#5d5d57;--blue:#1a4fff}
@media (prefers-color-scheme:dark){:root{--ink:#ecece8;--paper:#151515;--card:#1f1f1f;
--mute:#a8a8a0;--blue:#7d9cff}}
.bx{fill:var(--card);stroke:var(--ink);stroke-width:1.2}.ac{stroke:var(--blue);stroke-width:2}
.t{font:600 15px "Averia Serif Libre",Georgia,serif;fill:var(--ink)}
.m{font:600 12.5px "Atkinson Hyperlegible",Helvetica,Arial,sans-serif;fill:var(--ink)}
.s{font:12.5px "Atkinson Hyperlegible",Helvetica,Arial,sans-serif;fill:var(--mute)}
.n{font:700 13px "Atkinson Hyperlegible",Helvetica,Arial,sans-serif;fill:var(--blue)}
.lane{font:700 11px "Atkinson Hyperlegible",Helvetica,Arial,sans-serif;fill:var(--mute);
letter-spacing:.12em}
.ln{stroke:var(--ink);stroke-width:1.4}.hd{fill:var(--ink)}.bg{fill:var(--paper)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="hd"/></marker></defs><rect width="1100" height="690" class="bg"/><text x="25" y="68" class="t">1  Reflex</text><text x="25" y="88" class="s">every frame</text><text x="25" y="104" class="s">under 250 ms</text><text x="25" y="120" class="s">no language model</text><rect x="185" y="34" width="205" height="86" rx="10" class="bx ac"/><text x="197" y="56" class="t">Live depth</text><text x="197" y="74" class="m">Depth Anything + YOLO26n</text><text x="197" y="91" class="s">floor, steps, 8 sectors</text><text x="197" y="109" class="n">frame to cue 186 ms</text><rect x="416" y="34" width="205" height="86" rx="10" class="bx ac"/><text x="428" y="56" class="t">Map checks</text><text x="428" y="74" class="m">scale, out of view, new</text><text x="428" y="91" class="s">the map feeds the reflex</text><text x="428" y="109" class="n">distance error 34% to 16%</text><line x1="390" y1="77.0" x2="416" y2="77.0" class="ln" marker-end="url(#a)"/><rect x="647" y="34" width="205" height="86" rx="10" class="bx ac"/><text x="659" y="56" class="t">STOP buzz</text><text x="659" y="74" class="m">belt stop layer</text><text x="659" y="91" class="s">beats everything else</text><text x="659" y="109" class="n">server to motor 38-56 ms</text><line x1="621" y1="77.0" x2="647" y2="77.0" class="ln" marker-end="url(#a)"/><text x="25" y="194" class="t">2  See, remember</text><text x="25" y="214" class="s">every few seconds</text><text x="25" y="230" class="s">in the background</text><rect x="185" y="160" width="205" height="86" rx="10" class="bx"/><text x="197" y="182" class="t">Frame picker</text><text x="197" y="200" class="m">sharpest frame per slot</text><text x="197" y="217" class="s">1.5 a second at home</text><text x="197" y="235" class="n">next: novelty, change</text><rect x="416" y="160" width="205" height="86" rx="10" class="bx"/><text x="428" y="182" class="t">MapAnything</text><text x="428" y="200" class="m">open, Meta</text><text x="428" y="217" class="s">3D map with real scale</text><text x="428" y="235" class="n">19.6 s a window</text><line x1="390" y1="203.0" x2="416" y2="203.0" class="ln" marker-end="url(#a)"/><rect x="647" y="160" width="205" height="86" rx="10" class="bx"/><text x="659" y="182" class="t">DINOv2</text><text x="659" y="200" class="m">open, Meta</text><text x="659" y="217" class="s">knows a place seen before</text><text x="659" y="235" class="n">revisit 1.15 m to 0.46 m</text><line x1="621" y1="203.0" x2="647" y2="203.0" class="ln" marker-end="url(#a)"/><rect x="878" y="160" width="205" height="86" rx="10" class="bx"/><text x="890" y="182" class="t">Memory bank</text><text x="890" y="200" class="m">pins + SAM 3.1 check</text><text x="890" y="217" class="s">what, where, when, near</text><text x="890" y="235" class="n">SAM 3.1: 0.6 to 1.5 s</text><line x1="852" y1="203.0" x2="878" y2="203.0" class="ln" marker-end="url(#a)"/><text x="25" y="320" class="t">3  Talk</text><text x="25" y="340" class="s">when you ask</text><text x="25" y="356" class="s">about 0.9 s</text><rect x="185" y="286" width="205" height="86" rx="10" class="bx ac"/><text x="197" y="308" class="t">Transcribe</text><text x="197" y="326" class="m">Muse Voice Transcribe</text><text x="197" y="343" class="s">mic open, finds turn end</text><text x="197" y="361" class="n">turn end 164 ms</text><rect x="416" y="286" width="205" height="86" rx="10" class="bx ac"/><text x="428" y="308" class="t">Muse Spark 1.3</text><text x="428" y="326" class="m">memory-bank questions</text><text x="428" y="343" class="s">tools for people, changes</text><text x="428" y="361" class="n">first word 0.7-1.0 s</text><line x1="390" y1="329.0" x2="416" y2="329.0" class="ln" marker-end="url(#a)"/><rect x="647" y="286" width="205" height="86" rx="10" class="bx ac"/><text x="659" y="308" class="t">Answer</text><text x="659" y="326" class="m">voice in the glasses</text><text x="659" y="343" class="s">pin lit, belt points</text><text x="659" y="361" class="n">last word to answer 871 ms</text><line x1="621" y1="329.0" x2="647" y2="329.0" class="ln" marker-end="url(#a)"/><rect x="878" y="286" width="205" height="86" rx="10" class="bx ac"/><text x="890" y="308" class="t">Offline</text><text x="890" y="326" class="m">Muse Glimmer, open</text><text x="890" y="343" class="s">stands in for Spark</text><text x="890" y="361" class="n">one sentence 1.2-2.6 s</text><text x="25" y="446" class="t">Navigate</text><text x="25" y="466" class="s">three layers</text><text x="25" y="482" class="s">the reflex wins</text><rect x="185" y="412" width="205" height="86" rx="10" class="bx"/><text x="197" y="434" class="t">Goal</text><text x="197" y="452" class="m">from Muse</text><text x="197" y="469" class="s">&quot;take me to my keys&quot;</text><text x="197" y="487" class="n">a pin</text><rect x="416" y="412" width="205" height="86" rx="10" class="bx"/><text x="428" y="434" class="t">Path planner</text><text x="428" y="452" class="m">nav.py, no model</text><text x="428" y="469" class="s">through doorways</text><text x="428" y="487" class="n">milliseconds; wiring</text><line x1="390" y1="455.0" x2="416" y2="455.0" class="ln" marker-end="url(#a)"/><rect x="647" y="412" width="205" height="86" rx="10" class="bx"/><text x="659" y="434" class="t">GUIDE pulses</text><text x="659" y="452" class="m">belt guide layer</text><text x="659" y="469" class="s">soft turn-by-turn</text><text x="659" y="487" class="n">STOP overrides it</text><line x1="621" y1="455.0" x2="647" y2="455.0" class="ln" marker-end="url(#a)"/><text x="25" y="572" class="t">4  Deep</text><text x="25" y="592" class="s">every few minutes</text><text x="25" y="608" class="s">nobody waiting</text><rect x="185" y="538" width="205" height="86" rx="10" class="bx"/><text x="197" y="560" class="t">Map review</text><text x="197" y="578" class="m">Muse Wonder</text><text x="197" y="595" class="s">which changes matter</text><text x="197" y="613" class="n">9-15 s, about $0.15/hour</text><rect x="416" y="538" width="205" height="86" rx="10" class="bx"/><text x="428" y="560" class="t">Plans</text><text x="428" y="578" class="m">not built</text><text x="428" y="595" class="s">&quot;get ready to leave&quot;</text><text x="428" y="613" class="n">goals for Navigate</text><line x1="390" y1="581.0" x2="416" y2="581.0" class="ln" marker-end="url(#a)"/><rect x="647" y="538" width="205" height="86" rx="10" class="bx"/><text x="659" y="560" class="t">Nudges</text><text x="659" y="578" class="m">not built</text><text x="659" y="595" class="s">&quot;closet: 3 days unseen&quot;</text><text x="659" y="613" class="n">from last-seen times</text><line x1="621" y1="581.0" x2="647" y2="581.0" class="ln" marker-end="url(#a)"/><line x1="518.5" y1="160" x2="518.5" y2="120" class="ln" marker-end="url(#a)"/><text x="526.5" y="144.0" class="s">map scale</text><line x1="980.5" y1="246" x2="558.5" y2="286" class="ln" marker-end="url(#a)"/><text x="779.5" y="270.0" class="s">pins</text><line x1="518.5" y1="538" x2="327.5" y2="498" class="ln" marker-end="url(#a)"/><text x="435.0" y="522.0" class="s">goals</text><text x="25" y="656" class="s">Measured on the Mac mini (M5 Pro): medians or the range seen. Blue boxes are on the cue or answer path; the others run beside them. Map review marks new obstacles for the reflex.</text><text x="25" y="676" class="s">Sources for every number: docs/ARCHITECTURE.md. STOP never waits on an AI model.</text></svg>
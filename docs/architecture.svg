<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560"><style>.t{font:600 15px "Averia Serif Libre",Georgia,serif;fill:#161616}.s{font:12.5px "Atkinson Hyperlegible",Helvetica,Arial,sans-serif;fill:#666660}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#161616"/></marker></defs><rect width="1100" height="560" fill="#f6f6f4"/><rect x="30" y="40" width="200" height="110" rx="10" fill="#fff" stroke="#161616" stroke-width="1.2"/><text x="44" y="66" class="t">Phone browser</text><text x="44" y="88" class="s">camera + DeviceMotion</text><text x="44" y="106" class="s">later: glasses via the</text><text x="44" y="124" class="s">iOS Wearables DAT app</text><rect x="30" y="200" width="200" height="110" rx="10" fill="#fff" stroke="#1a4fff" stroke-width="2"/><text x="44" y="226" class="t">Web client</text><text x="44" y="248" class="s">live view + proximity</text><text x="44" y="266" class="s">ring and belt cells</text><text x="44" y="284" class="s">3D map, pins, fly-to</text><rect x="30" y="360" width="200" height="150" rx="10" fill="#fff" stroke="#161616" stroke-width="1.2"/><text x="44" y="386" class="t">Cues</text><text x="44" y="408" class="s">audio tones and speech</text><text x="44" y="426" class="s">haptic pulses</text><text x="44" y="444" class="s">off &gt; 2 m, slow 2-1 m,</text><text x="44" y="462" class="s">fast 1-0.5 m, solid</text><rect x="330" y="40" width="330" height="200" rx="10" fill="#fff" stroke="#1a4fff" stroke-width="2"/><text x="344" y="66" class="t">Mac mini server (Python)</text><text x="344" y="88" class="s">WebSocket ingest: JPEG frames + pose/motion</text><text x="344" y="106" class="s">Safety loop, 10-20 Hz:</text><text x="344" y="124" class="s">  metric depth + YOLO26 -&gt; 3 live sectors</text><text x="344" y="142" class="s">  5 more sectors from the map</text><text x="344" y="160" class="s">Fall check-in + shaking notice (motion)</text><text x="344" y="178" class="s">Query: &#x27;where are my keys&#x27; -&gt; pin + sentence</text><rect x="330" y="290" width="330" height="220" rx="10" fill="#fff" stroke="#161616" stroke-width="1.2"/><text x="344" y="316" class="t">Memory loop (own process)</text><text x="344" y="338" class="s">keyframes -&gt; MapAnything windows (8 views)</text><text x="344" y="356" class="s">Sim3 stitch on overlap pixels, 5 cm voxels</text><text x="344" y="374" class="s">scale hint re-anchors live depth</text><text x="344" y="392" class="s">object finder watch-list -&gt; pins with</text><text x="344" y="410" class="s">label, position, time, thumbnail, landmarks</text><text x="344" y="428" class="s">saved to sessions/&lt;name&gt;.npz</text><rect x="760" y="40" width="310" height="130" rx="10" fill="#fff" stroke="#161616" stroke-width="1.2"/><text x="774" y="66" class="t">Language step (one interface)</text><text x="774" y="88" class="s">template  |  openai  |  meta (Muse Spark)</text><text x="774" y="106" class="s">turns facts into one short sentence</text><text x="774" y="124" class="s">key from env or Keychain, never a file</text><rect x="760" y="210" width="310" height="130" rx="10" fill="#fff" stroke="#161616" stroke-width="1.2"/><text x="774" y="236" class="t">Small-object finder (one interface)</text><text x="774" y="258" class="s">yoloe (local, default)  |  sam31 (Meta)</text><text x="774" y="276" class="s">one switch in metasight.toml</text><text x="774" y="294" class="s">language = &#x27;meta&#x27;, finder = &#x27;sam31&#x27;</text><rect x="760" y="380" width="310" height="130" rx="10" fill="#fff" stroke="#161616" stroke-width="1.2"/><text x="774" y="406" class="t">Models on the Mac</text><text x="774" y="428" class="s">Depth Anything V2 metric (fp16, MPS)</text><text x="774" y="446" class="s">YOLO26n, YOLOE-26s-seg</text><text x="774" y="464" class="s">MapAnything (Apache-2.0 weights)</text><line x1="130" y1="150" x2="130" y2="200" stroke="#161616" stroke-width="1.4" marker-end="url(#a)"/><text x="130.0" y="169.0" class="s" text-anchor="middle">frames, motion</text><line x1="230" y1="255" x2="330" y2="120" stroke="#161616" stroke-width="1.4" marker-end="url(#a)"/><text x="280.0" y="179.5" class="s" text-anchor="middle">ws</text><line x1="330" y1="160" x2="230" y2="280" stroke="#161616" stroke-width="1.4" marker-end="url(#a)"/><text x="280.0" y="234.0" class="s" text-anchor="middle">overlay, map, answers</text><line x1="130" y1="310" x2="130" y2="360" stroke="#161616" stroke-width="1.4" marker-end="url(#a)"/><line x1="495" y1="240" x2="495" y2="290" stroke="#161616" stroke-width="1.4" marker-end="url(#a)"/><text x="495.0" y="259.0" class="s" text-anchor="middle">keyframes / map</text><line x1="660" y1="100" x2="760" y2="100" stroke="#161616" stroke-width="1.4" marker-end="url(#a)"/><text x="710.0" y="94.0" class="s" text-anchor="middle">facts</text><line x1="660" y1="400" x2="760" y2="260" stroke="#161616" stroke-width="1.4" marker-end="url(#a)"/><line x1="660" y1="450" x2="760" y2="445" stroke="#161616" stroke-width="1.4" marker-end="url(#a)"/></svg>
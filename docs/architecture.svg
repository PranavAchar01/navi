<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600"><style>:root{--ink:#161616;--paper:#f6f6f4;--card:#fff;--mute:#5d5d57;--blue:#1a4fff}
@media (prefers-color-scheme:dark){:root{--ink:#ecece8;--paper:#151515;--card:#1f1f1f;
--mute:#a8a8a0;--blue:#7d9cff}}
.bx{fill:var(--card);stroke:var(--ink);stroke-width:1.2}.ac{stroke:var(--blue);stroke-width:2}
.t{font:600 15px "Averia Serif Libre",Georgia,serif;fill:var(--ink)}
.m{font:600 12.5px "Atkinson Hyperlegible",Helvetica,Arial,sans-serif;fill:var(--ink)}
.s{font:12.5px "Atkinson Hyperlegible",Helvetica,Arial,sans-serif;fill:var(--mute)}
.n{font:700 13px "Atkinson Hyperlegible",Helvetica,Arial,sans-serif;fill:var(--blue)}
.lane{font:700 11px "Atkinson Hyperlegible",Helvetica,Arial,sans-serif;fill:var(--mute);
letter-spacing:.12em}
.ln{stroke:var(--ink);stroke-width:1.4}.hd{fill:var(--ink)}.bg{fill:var(--paper)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="hd"/></marker></defs><rect width="1100" height="600" class="bg"/><text x="25" y="44" class="lane">ALWAYS RUNNING, EVERY FRAME</text><text x="25" y="314" class="lane">WHEN YOU ASK</text><rect x="25" y="60" width="190" height="158" rx="10" class="bx"/><text x="39" y="86" class="t">1  Capture</text><text x="39" y="106" class="m">Ray-Ban Meta or phone</text><text x="39" y="126" class="s">camera frames, motion,</text><text x="39" y="143" class="s">microphone audio</text><text x="39" y="160" class="s">glasses: Wearables DAT</text><text x="39" y="204" class="n">17 frames a second</text><rect x="240" y="60" width="190" height="158" rx="10" class="bx"/><text x="254" y="86" class="t">2  Transport</text><text x="254" y="106" class="m">WebSocket to the Mac mini</text><text x="254" y="126" class="s">one socket carries</text><text x="254" y="143" class="s">frames, motion and</text><text x="254" y="160" class="s">16 kHz mic audio</text><text x="254" y="204" class="n">inside the 186 ms below</text><rect x="455" y="60" width="190" height="158" rx="10" class="bx ac"/><text x="469" y="86" class="t">3  Safety loop</text><text x="469" y="106" class="m">Depth Anything + YOLO26n</text><text x="469" y="126" class="s">floor, obstacles and</text><text x="469" y="143" class="s">8 direction sectors</text><text x="469" y="160" class="s">on the Mac&#x27;s GPU</text><text x="469" y="204" class="n">frame to cue 186 ms</text><rect x="670" y="60" width="190" height="158" rx="10" class="bx"/><text x="684" y="86" class="t">4  Map and memory</text><text x="684" y="106" class="m">MapAnything</text><text x="684" y="126" class="s">3D map of the house,</text><text x="684" y="143" class="s">pins: what, where,</text><text x="684" y="160" class="s">when, what was near</text><text x="684" y="204" class="n">map window 19.6 s</text><rect x="885" y="60" width="190" height="158" rx="10" class="bx"/><text x="899" y="86" class="t">5  Finder</text><text x="899" y="106" class="m">YOLOE + Muse SAM 3.1</text><text x="899" y="126" class="s">names what is in the</text><text x="899" y="143" class="s">frame; SAM 3.1 checks</text><text x="899" y="160" class="s">small things (keys)</text><text x="899" y="204" class="n">SAM 3.1: 0.6 to 1.5 s</text><rect x="25" y="330" width="405" height="158" rx="10" class="bx ac"/><text x="39" y="356" class="t">8  Answer</text><text x="39" y="376" class="m">speech, lens, haptics</text><text x="39" y="396" class="s">one sentence read out in the glasses or phone,</text><text x="39" y="413" class="s">the pin lit up on the screen, and the belt</text><text x="39" y="430" class="s">buzzes toward obstacles (server to motor 38-56 ms)</text><text x="39" y="474" class="n">last word to answer 871 ms</text><rect x="505" y="330" width="230" height="158" rx="10" class="bx ac"/><text x="519" y="356" class="t">7  Muse Spark 1.3</text><text x="519" y="376" class="m">phrases from the facts</text><text x="519" y="396" class="s">starts on the first</text><text x="519" y="413" class="s">partial words; Glimmer</text><text x="519" y="430" class="s">30B on the Mac if offline</text><text x="519" y="474" class="n">first word 0.7 to 1.0 s</text><rect x="885" y="330" width="190" height="158" rx="10" class="bx ac"/><text x="899" y="356" class="t">6  Question</text><text x="899" y="376" class="m">Muse Voice Transcribe</text><text x="899" y="396" class="s">mic stays open; the</text><text x="899" y="413" class="s">model hears where the</text><text x="899" y="430" class="s">question ends</text><text x="899" y="474" class="n">turn end 164 ms</text><line x1="215" y1="139.0" x2="240" y2="139.0" class="ln" marker-end="url(#a)"/><line x1="430" y1="139.0" x2="455" y2="139.0" class="ln" marker-end="url(#a)"/><line x1="645" y1="139.0" x2="670" y2="139.0" class="ln" marker-end="url(#a)"/><line x1="860" y1="139.0" x2="885" y2="139.0" class="ln" marker-end="url(#a)"/><line x1="550.0" y1="218" x2="490.0" y2="330" class="ln" marker-end="url(#a)"/><text x="458.0" y="278.0" class="s" text-anchor="middle">obstacle cues</text><line x1="795.0" y1="218" x2="755.0" y2="330" class="ln" marker-end="url(#a)"/><text x="819.0" y="278.0" class="s" text-anchor="middle">pins and map</text><line x1="885" y1="409.0" x2="735" y2="409.0" class="ln" marker-end="url(#a)"/><text x="810.0" y="402.0" class="s" text-anchor="middle">words</text><line x1="505" y1="409.0" x2="430" y2="409.0" class="ln" marker-end="url(#a)"/><text x="25" y="566" class="s">Measured on the Mac mini (M5 Pro): medians, or the range seen. Boxes in blue are on the answer or cue path; the map and finder run beside them.</text><text x="25" y="586" class="s">Sources for every number: docs/ARCHITECTURE.md.</text></svg>